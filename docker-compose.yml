version: '3.9'

services:
  # MongoDB for data storage
  mongodb:
    image: mongo:7.0
    container_name: nirmaan-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: nirmaan
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nirmaan-network

  # Redis for caching and job queue
  redis:
    image: redis:7.0-alpine
    container_name: nirmaan-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nirmaan-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nirmaan-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URLS: http://localhost:3500,http://localhost:3000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/nirmaan?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JUDGE0_API_BASE_URL: https://judge0-ce.p.rapidapi.com
      JUDGE0_API_HOST: judge0-ce.p.rapidapi.com
      JUDGE0_API_KEY: ${JUDGE0_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DOCKER_SOCKET: /var/run/docker.sock
    env_file:
      - ./backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/src:/app/src
      - backend_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nirmaan-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://nirmaan-backend:5000
    container_name: nirmaan-frontend
    restart: unless-stopped
    ports:
      - '3500:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      BACKEND_URL: http://nirmaan-backend:5000
      NEXT_PUBLIC_ENVIRONMENT: production
    depends_on:
      - backend
    networks:
      - nirmaan-network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  backend_node_modules:

networks:
  nirmaan-network:
    driver: bridge
