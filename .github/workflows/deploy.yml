name: Direct Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -e

            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git checkout main
            git pull origin main

            cd backend
            npm install
            pm2 startOrReload ecosystem.config.js --env production

            cd ../frontend
            npm install
            npm run build

            if pm2 describe career-os-frontend > /dev/null 2>&1; then
              pm2 restart career-os-frontend
            else
              pm2 start npm --name career-os-frontend -- start -- -p 3500
            fi

            pm2 save
